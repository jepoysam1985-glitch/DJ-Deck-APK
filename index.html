.a{position:absolute;background-size:100% 100%;border-radius:50%}
.dk{position:absolute;width:0;height:0}
.hit{position:absolute;border-radius:50%}
.on{box-shadow:0 0 18px 6px currentColor,0 0 0 3px currentColor inset;background:rgba(255,255,255,.18)}
.name{display:none;position:absolute;width:360px;left:-180px;top:-210px;text-align:center;font:600 20px system-ui,sans-serif;color:#fff;opacity:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mid{position:absolute;top:0;width:0;height:0}
.groove{position:absolute;border-radius:4px;background:linear-gradient(90deg,#0a0a0a,#2a2a2a);box-shadow:0 0 0 2px #777,0 1px 0 3px #1a1a1a}
.knob{position:absolute;width:46px;height:26px;border-radius:6px;background:linear-gradient(#d8d8d8,#6e6e6e 55%,#9a9a9a);
  box-shadow:0 3px 6px #000a,0 0 0 1px #222;pointer-events:none}
.knob:after{content:"";position:absolute;left:4px;right:4px;top:11px;height:3px;background:var(--ac);box-shadow:0 0 8px var(--ac);border-radius:2px}
.lab{position:absolute;font:600 13px system-ui,sans-serif;color:#bbb;text-align:center;width:60px;margin-left:-30px}
.bpm{position:absolute;width:150px;height:46px;margin-left:-75px;border-radius:8px;background:#06090c;border:2px solid #777;
  color:var(--ac);text-shadow:0 0 8px var(--ac);font:700 24px ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center;gap:6px}
.bpm small{font-size:11px;opacity:.7}
.bpm.beat{filter:brightness(1.7);box-shadow:0 0 14px currentColor}
.tk{position:absolute;background:#9aa3ab;opacity:.8;pointer-events:none;border-radius:1px}
.tk.c{background:var(--ac);opacity:1;box-shadow:0 0 6px var(--ac)}
.tk.c.lk{background:#fff;box-shadow:0 0 12px var(--ac),0 0 4px #fff}
.wv{position:absolute;border-radius:10px;background:rgba(0,0,0,.4);box-shadow:0 0 0 2px #777}.wb{position:absolute}
#vl{z-index:3;position:absolute;top:0;width:2px;height:118px;background:#fff;margin-left:-1px}
#rot{position:fixed;inset:0;background:#111;color:#ddd;display:none;align-items:center;justify-content:center;font:20px system-ui;z-index:9}
@media(orientation:portrait){#rot{display:flex}}
input{display:none}
/* ===== SKIN NG PLAY BUTTON (brushed-metal na may berdeng ring) = gamit na ng LAHAT ng button ===== */
.dbtn,.lb{--rg:transparent;--metal:conic-gradient(from 20deg at 50% 50%,#3d3d3b 0%,#6d6c68 9%,#9b9892 16%,#4a4a47 25%,#3d3d3b 38%,#56574f 47%,#3d3d3b 56%,#9b9892 66%,#4a4a47 75%,#3d3d3b 86%,#6d6c68 94%,#3d3d3b 100%);
  background:var(--metal);border-style:solid;border-color:var(--rg);color:#e9ebe4;text-shadow:0 1px 2px #000,0 0 4px #000;
  box-shadow:inset 0 0 10px 2px #000a,0 3px 8px #000a}
.dbtn.on,.lb.on{color:#f2fcff;text-shadow:0 0 4px var(--rg),0 1px 2px #000;filter:brightness(1.2);
  background:linear-gradient(rgba(255,255,255,.14),rgba(255,255,255,.14)),var(--metal);
  box-shadow:inset 0 0 10px 2px #000a,0 3px 8px #000a}
.dbtn{position:absolute;display:flex;align-items:center;justify-content:center;border-width:3px;border-radius:28px;font:700 14px system-ui,sans-serif;text-align:center}
.dbtn:active{filter:brightness(1.5)}
.stat{position:absolute;left:-170px;top:113px;width:340px;height:20px;text-align:center;font:600 13px system-ui,sans-serif;color:var(--act);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;transition:opacity .2s;text-shadow:0 0 6px #000}
.eqback{position:absolute;left:0;top:0;right:0;height:720px;background:rgba(10,12,16,.94);z-index:20;display:none}
.cl{position:absolute;font:600 14px system-ui,sans-serif;color:#9ab;white-space:nowrap}
.eqt{position:absolute;left:-374px;top:30px;font:700 20px system-ui,sans-serif;color:var(--ac);white-space:nowrap}
.eqv{position:absolute;top:80px;width:60px;margin-left:-30px;text-align:center;font:600 14px ui-monospace,Menlo,monospace;color:#fff}
.eqz{position:absolute;left:-408px;top:320px;width:816px;height:1px;background:rgba(255,255,255,.28)}
.eqinfo{position:absolute;left:-374px;top:600px;width:748px;text-align:center;font:600 15px system-ui,sans-serif;color:#9ab}

.libback{z-index:22}
.lib{position:absolute;inset:0;padding:12px 44px 10px;display:flex;flex-direction:column;gap:8px;font-family:system-ui,sans-serif;color:#dfe6ee}
.lib,.lib *{touch-action:pan-y}
.lh,.lbar{display:flex;align-items:center;gap:8px;flex:none}
.lt{display:flex;align-items:center;gap:8px;font:700 20px system-ui,sans-serif;color:var(--ac);margin-right:6px}
.lb{height:44px;padding:0 14px;border-radius:999px;border-width:2px;font:700 13px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;white-space:nowrap;flex:none;margin:0;outline:0}
.lb:active{filter:brightness(1.5)}
.lb.warn{--rg:#ff5a5a;color:#ffd6d6;box-shadow:inset 0 0 0 3px #ffb0b0,inset 0 0 12px 2px #ff5a5a99,0 0 16px 4px #ff5a5a99}
.lb.sm{height:38px;padding:0 12px;min-width:44px}
.lb.dk0{--rg:var(--ac);color:var(--acw)}.lb.dk1{--rg:var(--bc);color:var(--bct)}
.lb.more{width:calc(100% - 16px);margin:8px}
.lb.wide{width:100%;justify-content:flex-start}
.lsp{flex:1}
.lst{flex:1;min-width:0;font:600 14px system-ui,sans-serif;color:var(--act);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lact{display:flex;gap:8px}
.llist{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:10px;background:rgba(0,0,0,.3);box-shadow:0 0 0 2px #444}
.lr{display:flex;align-items:center;gap:10px;min-height:76px;padding:8px 12px;border-bottom:1px solid #2a2f36}
.lr .tx{flex:1;min-width:0}
.lr .n{font:700 26px system-ui,sans-serif;color:#eef;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .s{font:500 15px system-ui,sans-serif;color:#8a97a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr.dim{opacity:.45}.lr.go:active{background:#1e2a36}
.lem{padding:36px 24px;text-align:center;color:#8a97a6;font:600 15px system-ui,sans-serif;line-height:1.7}

.lpp{width:440px;max-height:92%;display:flex;flex-direction:column;gap:8px;background:#15181d;border:2px solid #777;border-radius:12px;padding:14px}
.lpp .t{font:700 16px system-ui,sans-serif;color:var(--ac)}
.lpl{overflow-y:auto;max-height:280px;display:flex;flex-direction:column;gap:8px}
.wl{position:absolute;top:0;height:50px;pointer-events:none;overflow:hidden;text-shadow:0 0 6px #000}
.wl b,.wl span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:14px}

.wl.dk0{color:var(--ac);text-align:left}.wl.dk1{color:var(--bc);text-align:right}
.lb.xd{--rg:#e04545;color:#ff8a8a}
.wl{display:flex;gap:6px;align-items:center}.wl.dk1{flex-direction:row-reverse}.wl>div{flex:1;min-width:0}
.wl i{flex:none;width:46px;height:46px;border-radius:6px;background:#1b1e23 center/cover;border:1px solid currentColor;font:700 20px/44px system-ui,sans-serif;text-align:center;font-style:normal}
.cv{flex:none;width:58px;height:58px;border-radius:7px;background:#1b1e23 center/cover;color:#566;font:700 24px/58px system-ui,sans-serif;text-align:center}
.bp{flex:none;min-width:72px;text-align:right;font:700 13px ui-monospace,Menlo,monospace;color:var(--act)}.bp.dim{color:#566}
.stopb{position:absolute;left:-94px;top:230px;width:60px;height:60px;border-radius:50%;background-size:100% 100%}
.stopb:active{filter:brightness(1.4)}
.fxpad{position:absolute;display:none;border-radius:14px;background:radial-gradient(circle at 50% 50%,#14283a,#070a0e);border:2px solid var(--ac);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 27%,transparent) inset,0 0 0 2px #0008;overflow:hidden}
.fxpad:before,.fxpad:after{content:"";position:absolute;background:color-mix(in srgb,var(--ac) 13%,transparent)}.fxpad:before{left:50%;top:0;bottom:0;width:1px}.fxpad:after{top:50%;left:0;right:0;height:1px}
.fxdot{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:radial-gradient(#fff,var(--ac) 55%,color-mix(in srgb,var(--ac) 0%,transparent) 72%);box-shadow:0 0 34px 12px color-mix(in srgb,var(--ac) 60%,transparent);opacity:0;pointer-events:none;left:50%;top:50%}
.fxtx{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font:700 28px/1.5 system-ui,sans-serif;color:#3f6a8a;pointer-events:none;white-space:pre-line;transition:opacity .15s}
.pd{border:0!important;border-radius:16px;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.42),rgba(255,255,255,0) 72%),var(--c)!important;color:rgba(0,0,0,.68)!important;text-shadow:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 3px 8px #0009!important;opacity:.5;font-weight:700;line-height:1.35;transition:opacity .08s,filter .08s}
.pd.lit{opacity:1}.pd:active{opacity:1;filter:brightness(1.3)}
.pd.on{opacity:1!important;filter:brightness(1.22);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 26px 7px var(--c)!important}
.pd{overflow:hidden}.pd,.pd.on{text-shadow:none}
.pd::after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,rgba(255,255,255,.1),rgba(255,255,255,.45));transform:scaleX(0);transform-origin:left;opacity:0;pointer-events:none}
.pd::before{content:"";position:absolute;left:0;bottom:0;height:8px;width:100%;background:#fff;box-shadow:0 0 12px #fff;transform:scaleX(0);transform-origin:left;opacity:0;pointer-events:none;z-index:1}
.pd.ld::after,.pd.ld::before{animation:ldfill var(--d,.4s) linear forwards}
@keyframes ldfill{0%{transform:scaleX(0);opacity:1}92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.pgrid{position:absolute;left:24px;right:24px;top:90px;bottom:24px;display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:flex-start;overflow:auto}
.ptile{width:150px;height:150px;border-radius:14px;background:#15181d;border:2px solid #444;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#cfd3d8;font:700 13px system-ui,sans-serif}
.ptile.sel{border-color:var(--ac);box-shadow:0 0 14px color-mix(in srgb,var(--ac) 53%,transparent)}
.fxmix{position:absolute;display:none;border-radius:12px;background:#0b0f14;border:2px solid var(--ac);overflow:hidden}
.fxmix .mf{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--acd),color-mix(in srgb,var(--ac) 53%,transparent))}
.fxmix span{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font:700 16px system-ui,sans-serif;color:#cfeaff;pointer-events:none}
.fxtr{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(#fff,color-mix(in srgb,var(--ac) 67%,transparent) 55%,color-mix(in srgb,var(--ac) 0%,transparent) 72%);pointer-events:none;animation:trf .6s forwards}
@keyframes trf{to{opacity:0;transform:scale(.25)}}
.fxtx small{font:600 17px system-ui,sans-serif;color:#2f5068}
</style></head><body>

    return(ac(Lg)+ac(2*Lg)/2+ac(3*Lg)/3+ac(4*Lg)/4)*Math.exp(-.5*(o/.8)*(o/.8))};

      b0=al/a0,b2=-al/a0,a1=-2*Math.cos(w0)/a0,a2=(1-al)/a0;let x1=0,x2=0,y1=0,y2=0,E=0;

const smpDb=()=>new Promise((res,rej)=>{const r=indexedDB.open('djsmp',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});

function smpStopPad(n,t){const q=smpPlay[n];if(!q)return;smpPlay[n]=null;t=t||.02;try{q.g.gain.setTargetAtTime(0,ctx.currentTime,t);q.src.stop(ctx.currentTime+t*6)}catch(e){}}

function smpDraw(n,b){const x=SMP[n],c=PC[n%8];b.style.borderColor=c;b.classList.remove('on');b.classList.toggle('lit',!!x);
  if(!x){b.textContent='PAD '+(n+1)+'\nEMPTY\n(tap = load)';b.style.background='';b.style.color=c;return}
  b.textContent=(n+1)+'. '+x.name.slice(0,14)+'\n'+x.buf.duration.toFixed(1)+' s';

  try{mr=new MediaRecorder(dest.stream)}catch(e){try{master.disconnect(dest)}catch(_){}flash('Recording is not supported');return}
  const ch=[],t0=Date.now();smpRec=mr;mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
  mr.onstop=()=>{clearInterval(smpTimer);try{master.disconnect(dest)}catch(_){}smpRec=null;smpRecB.textContent='REC';smpRecB.style.background='';smpRecB.style.color='';
    if(!ch.length)return;let n=SMP.findIndex(x=>!x);if(n<0)n=NSMP-1;smpSet(n,new Blob(ch,{type:mr.mimeType||'audio/webm'}),'REC '+(n+1))};
  mr.start();smpRecB.style.background='linear-gradient(#ff8a8a,#d63a3a)';smpRecB.style.color='#210606';
  smpTimer=setInterval(()=>{const sec=(Date.now()-t0)/1000;smpRecB.textContent='● STOP '+sec.toFixed(0)+'s';if(sec>=30&&smpRec)smpRec.stop()},250);smpRecB.textContent='● STOP 0s'}

(function(){
const g=id=>document.getElementById(id);
if(!g('stSoT'))return;
const P={
 youtube:{url:'rtmp://a.rtmp.youtube.com/live2',res:'1920x1080',fps:'30',vb:6000,ab:'128',kf:'2',sr:'44100',codec:'H.264',note:'YouTube: 1080p30 ~ 4500-9000 kbps. Stream key: YouTube Studio > Go Live.'},
 tiktok:{url:'',res:'1080x1920',fps:'30',vb:4000,ab:'128',kf:'2',sr:'44100',codec:'H.264',note:'TikTok: vertical 9:16. Ang server URL at stream key ay galing sa TikTok LIVE Studio at nagbabago kada live; i-paste mo mismo.'},
 facebook:{url:'rtmps://live-api-s.facebook.com:443/rtmp/',res:'1280x720',fps:'30',vb:4000,ab:'128',kf:'2',sr:'44100',codec:'H.264',note:'Facebook: hanggang 1080p30, keyframe 2s. Stream key: Live Producer.'}};
const K='dj_enc_social';let d={},cur='youtube';
try{d=JSON.parse(localStorage.getItem(K)||'{}');cur=localStorage.getItem(K+'_last')||'youtube'}catch(e){}
if(!P[cur])cur='youtube';
const F=['url','key','res','fps','vb','ab','kf','sr','codec'];
const fill=()=>{const s=Object.assign({},P[cur],d[cur]||{});
 F.forEach(f=>{g('so_'+f).value=s[f]==null?'':s[f]});
 g('stSoI').textContent=P[cur].note;
 [...g('stSoT').children].forEach(x=>x.classList.toggle('on',x.dataset.v===cur))};
const read=()=>{const o={};F.forEach(f=>o[f]=g('so_'+f).value.trim());o.vb=+o.vb||P[cur].vb;return o};
const say=t=>{g('stSoI').textContent=t;setTimeout(()=>{g('stSoI').textContent=P[cur].note},2500)};
g('stSoT').addEventListener('click',e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v||v===cur)return;d[cur]=read();cur=v;fill()});
g('stSoS').addEventListener('click',()=>{d[cur]=read();let ok=1;try{localStorage.setItem(K,JSON.stringify(d));localStorage.setItem(K+'_last',cur)}catch(e){ok=0}
 say(ok?'Na-save ang '+cur.toUpperCase()+' encoder.':'Hindi na-save (storage error).')});
g('stSoR').addEventListener('click',()=>{delete d[cur];try{localStorage.setItem(K,JSON.stringify(d))}catch(e){}fill();say('Binalik sa recommended preset.')});
window.getSocialEncoder=p=>{p=p||cur;return Object.assign({},P[p],d[p]||{})};
fill();
})();

djReady=true;

fit();
