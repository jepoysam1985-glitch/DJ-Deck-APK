name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'resources/**'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www/index.html
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/index.html ]; then
            echo "::error::index.html not found. Upload your DJ Deck index.html to the repo root, then re-run."
            exit 1
          fi

      - name: Bundle MP3 encoder (lamejs) para gumana ang GO LIVE kahit offline
        run: curl -fsSL -o www/lame.min.js https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add native Icecast/Shoutcast plugin
        run: |
          D=android/app/src/main/java/com/djdeck/app
          mkdir -p "$D"
          cp native/TcpSourcePlugin.java native/FolderPickerPlugin.java native/RtmpPlugin.java native/RtmpService.java native/MainActivity.java native/PerfPlugin.java "$D/"

      - name: Add RTMP library (RootEncoder)
        run: |
          sed -i "s#mavenCentral()#mavenCentral()\n        maven { url 'https://jitpack.io' }#" android/build.gradle
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "com.github.pedroSG94.RootEncoder:library:2.5.5"/' android/app/build.gradle
          cat android/build.gradle android/app/build.gradle

      - name: Patch manifest (landscape + permissions)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          sed -i 's#</application>#    <service android:name="com.djdeck.app.RtmpService" android:exported="false" android:foregroundServiceType="mediaProjection" />\n    </application>#' "$M"
          cat "$M"

      - name: Launcher icon + splash (from resources/icon.png)
        run: |
          if [ ! -f resources/icon.png ]; then
            echo "::warning::resources/icon.png not found - default icon will be used. Upload your logo to resources/icon.png and re-run."
            exit 0
          fi
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          IM=$(command -v magick || command -v convert)
          R=android/app/src/main/res
          declare -A LG=( [mdpi]=48 [hdpi]=72 [xhdpi]=96 [xxhdpi]=144 [xxxhdpi]=192 )
          declare -A FG=( [mdpi]=108 [hdpi]=162 [xhdpi]=216 [xxhdpi]=324 [xxxhdpi]=432 )
          for d in "${!LG[@]}"; do
            mkdir -p "$R/mipmap-$d"
            S=${LG[$d]}; FS=${FG[$d]}; IN=$((FS*66/100))
            $IM resources/icon.png -resize ${S}x${S} "$R/mipmap-$d/ic_launcher.png"
            cp "$R/mipmap-$d/ic_launcher.png" "$R/mipmap-$d/ic_launcher_round.png"
            $IM resources/icon.png -resize ${IN}x${IN} -background none -gravity center -extent ${FS}x${FS} "$R/mipmap-$d/ic_launcher_foreground.png"
          done
          mkdir -p "$R/values"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n' > "$R/values/ic_launcher_background.xml"
          for f in $(find "$R" -name 'splash.png'); do
            read W H <<< "$($IM "$f" -format '%w %h' info:)"
            M=$(( (W<H?W:H)*40/100 ))
            $IM -size ${W}x${H} xc:black \( resources/icon.png -resize ${M}x${M} \) -gravity center -composite "$f"
          done

      - name: Android 12+ splash theme (black background + logo)
        run: |
          S=android/app/src/main/res/values/styles.xml
          if [ -f resources/icon.png ] && grep -q 'parent="Theme.SplashScreen"' "$S"; then
            sed -i '/<style name="AppTheme.NoActionBarLaunch"/a\        <item name="windowSplashScreenBackground">#000000</item>\n        <item name="windowSplashScreenAnimatedIcon">@mipmap/ic_launcher_foreground</item>' "$S"
          fi
          cat "$S"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk The-Groove-Mixer-Pro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: The-Groove-Mixer-Pro
          path: The-Groove-Mixer-Pro.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: The Groove Mixer Pro build ${{ github.run_number }}
          files: The-Groove-Mixer-Pro.apk
