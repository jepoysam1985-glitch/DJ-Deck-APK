name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'www/**'
      - 'native/**'
      - 'capacitor.config.json'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare www/index.html
        run: |
          mkdir -p www
          if [ -f index.html ]; then cp index.html www/index.html; fi
          if [ ! -f www/index.html ]; then
            echo "::error::index.html not found. Upload your DJ Deck index.html to the repo root, then re-run."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add native Icecast/Shoutcast plugin
        run: |
          D=android/app/src/main/java/com/djdeck/app
          mkdir -p "$D"
          cp native/TcpSourcePlugin.java native/FolderPickerPlugin.java native/MainActivity.java "$D/"

      - name: Patch manifest (landscape + permissions)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"
          cat "$M"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DJ-Deck.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DJ-Deck-APK
          path: DJ-Deck.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DJ Deck build ${{ github.run_number }}
          files: DJ-Deck.apk
